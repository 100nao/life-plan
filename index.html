<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.github.com https://generativelanguage.googleapis.com https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="自分だけのライフプラン（やりたい事・後回しでいい事・習い事）">
  <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ライフプラン">
  <meta name="format-detection" content="telephone=no">
  <title>ライフプラン</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" data-action="openDrawer" aria-label="メニューを開く" aria-controls="drawer" aria-expanded="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>
      </button>
      <div class="brand">
        <a class="brand-pomu" href="#habits" aria-label="ぽむ：習慣スタンプへ" title="ぽむ"><img class="avatar pomu-avatar" id="topPomu" src="images/monster/stage-1-256.webp" alt="ぽむたま" width="44" height="44"></a>
        <a class="brand-name" href="#home" aria-label="ホームへ">ライフプラン</a>
      </div>
      <div class="topbar-actions">
        <a class="icon-btn sync-dot" id="syncDot" href="#settings/sync" hidden aria-label="同期の状態">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 9.5a4 4 0 0 1-.5 8.5z"/></svg>
        </a>
        <a class="icon-btn" href="#coach" aria-label="コーチに相談" data-nav="coach">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg><b class="badge" id="coachBadge" hidden></b>
        </a>
        <a class="icon-btn" href="#search" aria-label="検索" data-nav="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </a>
      </div>
    </header>

    <nav class="tabbar" aria-label="メインメニュー">
      <span class="tab-indicator" aria-hidden="true"></span>
      <a href="#home" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg><span>ホーム</span></a>
      <a href="#matrix" data-nav="matrix"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg><span>マトリクス</span></a>
      <a href="#wish" data-nav="wish"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span>やりたい事</span></a>
      <a href="#later" data-nav="later" class="pc-only"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>後回し</span></a>
      <a href="#lessons" data-nav="lessons" class="pc-only"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5C6.5 5 9.5 5 12 6.5c2.5-1.5 5.5-1.5 8 0V19c-2.5-1.5-5.5-1.5-8 0-2.5-1.5-5.5-1.5-8 0z"/><path d="M12 6.5V19"/></svg><span>習い事</span></a>
      <a href="#inbox" data-nav="inbox"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l2.5-8h11L20 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 13h4.5l1.5 2.5h4l1.5-2.5H20"/></svg><span>未整理</span><b class="badge" id="inboxBadge" hidden></b></a>
      <a href="#journal" data-nav="journal"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h11a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6z"/><path d="M6 3.5v17M9.5 8h5M9.5 11.5h5"/></svg><span>ジャーナル</span></a>
      <a href="#habits" data-nav="habits" class="pc-only"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M4 10h16"/><circle cx="12" cy="15" r="2.6"/></svg><span>習慣スタンプ</span></a>
      <a href="#countdown" data-nav="countdown" class="pc-only"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9"/></svg><span>カウントダウン</span></a>
      <a href="#aisuggest" data-nav="aisuggest" class="pc-only"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.6L18.5 9l-4.7 1.6L12 15.2l-1.8-4.6L5.5 9l4.7-1.4z"/><path d="M18 15l.9 2.1L21 18l-2.1.9L18 21l-.9-2.1L15 18l2.1-.9z"/></svg><span>AI提案</span><b class="badge sug-badge" hidden></b></a>
      <a href="#ai" data-nav="ai" class="pc-only"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="8" width="14" height="11" rx="3"/><path d="M12 4.5V8M9.5 13h.01M14.5 13h.01M9.5 16h5"/></svg><span>AIに相談</span></a>
      <a href="#coach" data-nav="coach" class="pc-only"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/></svg><span>コーチに相談</span></a>
      <a href="#done" data-nav="done" class="pc-only"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.5"/></svg><span>完了履歴</span></a>
      <a href="#search" data-nav="search" class="pc-only"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span>検索</span></a>
      <a href="#" class="pc-only tab-update" data-action="forceUpdate" aria-label="アップデート（最新版を読み込む）"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg><span>アップデート</span><small class="app-version">v1.5.0</small></a>
      <a href="#settings" data-nav="settings" class="pc-only"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg><span>設定・バックアップ</span></a>
    </nav>

    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop" data-action="closeDrawer" hidden></div>
  <aside class="drawer" id="drawer" aria-label="メニュー" aria-hidden="true" inert>
    <div class="drawer-head"><img class="avatar" src="images/avatar-128.png" alt="" width="44" height="44"><div><b>ライフプラン</b><span class="muted small">やりたい事を、一歩ずつ。</span></div></div>
    <p class="drawer-label">タブ</p>
    <nav class="drawer-nav">
      <a href="#home" data-nav="home"><span class="di">🏠</span>ホーム</a>
      <a href="#matrix" data-nav="matrix"><span class="di">🧭</span>マトリクス</a>
      <a href="#wish" data-nav="wish"><span class="di">⭐</span>やりたい事</a>
      <a href="#inbox" data-nav="inbox"><span class="di">📥</span>未整理</a>
      <a href="#journal" data-nav="journal"><span class="di">📔</span>ジャーナル</a>
    </nav>
    <p class="drawer-label">その他</p>
    <nav class="drawer-nav">
      <a href="#habits" data-nav="habits"><span class="di">🐣</span>習慣スタンプ</a>
      <a href="#later" data-nav="later"><span class="di">🕰️</span>後回しでいい事</a>
      <a href="#lessons" data-nav="lessons"><span class="di">🎹</span>習い事</a>
      <a href="#countdown" data-nav="countdown"><span class="di">⏳</span>カウントダウン</a>
      <a href="#aisuggest" data-nav="aisuggest"><span class="di">✨</span>AI提案<b class="badge sug-badge" hidden></b></a>
      <a href="#ai" data-nav="ai"><span class="di">🤖</span>AIに相談（Gemini）</a>
      <a href="#coach" data-nav="coach"><span class="di">💬</span>コーチに相談</a>
      <a href="#done" data-nav="done"><span class="di">🏆</span>完了履歴</a>
      <button type="button" class="drawer-update" data-action="forceUpdate"><span class="di">🔄</span>アップデート<small class="app-version">v1.5.0</small></button>
    </nav>
    <div class="drawer-foot">
      <a class="icon-btn round" href="#settings" data-nav="settings" aria-label="設定"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></a>
      <a class="drawer-search" href="#search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>検索</a>
      <button class="icon-btn round" data-action="quickAddFromDrawer" aria-label="すばやく追加"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
  </aside>

  <button class="fab" id="fab" data-action="quickAdd" aria-label="すばやく追加">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
